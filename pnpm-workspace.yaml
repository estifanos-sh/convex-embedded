packages:
  - apps/*
  - packages/*
  - tools/*
  - demos/*/*

catalogMode: prefer

catalog:
  "@types/node": ^25.9.1
  typescript: ^6
  "@typescript/native-preview": latest
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  playwright: ^1.56.0
  convex: ^1.40.0
  unplugin: ^2.3.10
  "@napi-rs/cli": ^3.7.0
  "@emnapi/core": 1.11.0
  "@emnapi/runtime": 1.11.0
  "@napi-rs/wasm-runtime": ^1.1.4
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@fontsource-variable/inter": ^5.2.8
  "@tailwindcss/forms": ^0.5.11
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  # esbuild is a transitive dep of `convex` (its CLI bundler); we build with tsdown and never run
  # esbuild, so don't build its native binary.
  esbuild: false
