packages:
  - apps/*
  - packages/*
  - tools/*
  - demos/*
  - demos/*/*

catalogMode: prefer

catalog:
  "@types/node": ^25.9.1
  typescript: ^6
  "@typescript/native-preview": latest
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
  playwright: ^1.56.0
  convex: ^1.42.1
  unplugin: ^2.3.10
  "@napi-rs/cli": ^3.7.0
  "@emnapi/core": 1.11.0
  "@emnapi/runtime": 1.11.0
  "@napi-rs/wasm-runtime": ^1.1.4
  binaryen: ^130.0.0
  tailwindcss: ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@fontsource-variable/inter": ^5.2.8
  "@tailwindcss/forms": ^0.5.11
  "@tanstack/devtools": ^0.12.2
  "@tanstack/devtools-vite": ^0.7.0
  codemirror: ^6.0.2
  "@codemirror/lang-json": ^6.0.2
  "@codemirror/lint": ^6.9.7
  solid-js: ^1.9.13
  vite-plugin-solid: ^2.11.12
  fast-check: ^4.8.0
  convex-helpers: ^0.1.120
  "@convex-dev/migrations": ^0.3.5
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Pin the vite-plus toolchain to 0.1.24. core/meta 0.2.1 is published but the matching
  # vite-plus-test 0.2.x is not yet, so `@latest` re-resolution pulls a broken core@0.2.1 /
  # test@0.1.24 skew that breaks `vp test` (the runner can't find vitest's bin). Remove once
  # @voidzero-dev/vite-plus-test@0.2.x ships.
  "@voidzero-dev/vite-plus-core": "0.1.24"
  "@voidzero-dev/vite-plus-test": "0.1.24"
  "@voidzero-dev/vite-plus": "0.1.24"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@convex-dev/static-hosting": true
  # esbuild is a transitive dep of `convex` (its CLI bundler); we build with tsdown and never run
  # esbuild, so don't build its native binary.
  esbuild: false
