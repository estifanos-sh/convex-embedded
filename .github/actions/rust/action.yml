name: Embedded Rust toolchain
description: Install the toolchain, components, and WASM targets pinned by this repository.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: nightly-2026-06-09
        components: clippy, rustfmt
        targets: wasm32-unknown-unknown, wasm32-wasip1-threads
