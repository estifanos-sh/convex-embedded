name: Preview package

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose local binaries
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build embedded TypeScript
        run: vp run @convex-dev/embedded#build:ts

      - name: Typecheck Expo demo
        run: vp run @convex-dev/embedded-demo-expo#typecheck

      - name: Test Expo editor helpers
        run: vp run @convex-dev/embedded-demo-expo#test

      - name: Check
        run: vp check

      - name: Build and inspect package
        run: pnpm --filter @convex-dev/embedded pack --dry-run

      - name: Test embedded
        run: |
          vp run @convex-dev/embedded#test:unit
          vp run @convex-dev/embedded#test:storage
          vp run @convex-dev/embedded#test:server
          vp run @convex-dev/embedded#test:surface
          vp run @convex-dev/embedded#test:runtime

      - name: Test packaged Node entrypoint
        run: vp run @convex-dev/embedded#test:node

  mobile-apple:
    name: Build Apple mobile artifact
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Prepare Rust and build the XCFramework through the Expo hook
        run: EAS_BUILD_PLATFORM=ios node demos/expo/scripts/native.ts eas

      - name: Compile Expo Apple autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts ios

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: embedded-mobile-apple
          path: packages/embedded/native/apple
          if-no-files-found: error

  mobile-android:
    name: Build Android mobile artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Prepare Rust and build Android libraries through the Expo hook
        run: EAS_BUILD_PLATFORM=android node demos/expo/scripts/native.ts eas

      - name: Compile Expo Android autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts android

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: embedded-mobile-android
          path: packages/embedded/native/android
          if-no-files-found: error

  preview:
    name: Publish preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [mobile-apple, mobile-android]
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download Apple mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: embedded-mobile-apple
          path: packages/embedded/native/apple

      - name: Download Android mobile artifacts
        uses: actions/download-artifact@v4
        with:
          name: embedded-mobile-android
          path: packages/embedded/native/android

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose local binaries
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build embedded TypeScript
        run: vp run @convex-dev/embedded#build:ts

      - name: Export Expo iOS bundle
        run: vp run @convex-dev/embedded-demo-expo#export:ios

      - name: Export Expo Android bundle
        run: vp run @convex-dev/embedded-demo-expo#export:android

      - name: Publish preview package
        run: >
          vp exec pkg-pr-new publish ./packages/embedded
          --pnpm
          --no-compact
          --comment=update
          --commentWithSha
          --packageManager=npm
