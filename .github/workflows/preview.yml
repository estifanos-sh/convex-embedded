name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  # Every Rust entrypoint routes through config/build.ts, which defaults the target directory to
  # the OS temp dir. Pin it inside the workspace so Swatinem/rust-cache actually caches the
  # compiled artifacts instead of an empty directory.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5

    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # An unresolved filter leaves the output empty, which the mobile jobs read as "no native
      # change". Pushes to main and manual runs build the mobile smoke slices regardless.
      - name: Filter native paths
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            mobile:
              - '.cargo/**'
              - '.github/workflows/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'config/**'
              - 'crates/**'
              - 'demos/expo/app.json'
              - 'demos/expo/eas.json'
              - 'demos/expo/scripts/native.ts'
              - 'packages/embedded/ConvexEmbeddedNative.podspec'
              - 'packages/embedded/android/**'
              - 'packages/embedded/expo-module.config.json'
              - 'packages/embedded/ios/**'
              - 'packages/embedded/native/**'
              - 'packages/embedded/package.json'
              - 'packages/embedded/scripts/mobile*.ts'
              - 'packages/embedded/scripts/native.ts'
              - 'rust-toolchain.toml'
              - 'vendor/**'

  verify:
    name: Verify
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # `fallow audit` compares this change against the PR base (or the preceding main
          # commit), so the base must be available locally. Keep the analysis in this existing
          # job rather than spending another runner allocation on a small Node-only gate.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build embedded TypeScript
        run: vp run @estifanos-sh/convex-embedded#build:ts

      # The preview job packs this exact tree instead of rebuilding it, so upload before the
      # native addon step writes the host-only dist/native artifact into the same directory.
      - name: Upload the TypeScript bundle
        uses: actions/upload-artifact@v7
        with:
          name: embedded-dist
          path: packages/embedded/dist
          if-no-files-found: error
          retention-days: 1

      - name: Typecheck Expo demo
        run: vp run @estifanos-sh/convex-embedded-demo-expo#typecheck

      - name: Test Expo editor helpers
        run: vp run @estifanos-sh/convex-embedded-demo-expo#test

      # Bundling the demo validates the @estifanos-sh/convex-embedded metro and expo entrypoints.
      # The demo's metro config wires its own client-safe deployment URL into the bundle;
      # a build-only value satisfies it since an export never connects to a backend.
      - name: Export Expo bundles
        env:
          VITE_CONVEX_URL: https://embedded-ci.convex.cloud
        run: |
          vp run @estifanos-sh/convex-embedded-demo-expo#export:ios
          vp run @estifanos-sh/convex-embedded-demo-expo#export:android

      - name: Check
        run: |
          vp check
          vp run style
          vp run clippy

      - name: Audit
        # This is deliberately a changed-code gate. The repository-wide cleanup is tracked by
        # the normal style/dead-code checks; `fallow audit` blocks only findings introduced by
        # the current PR or main push, so inherited complexity and clone findings cannot make a
        # previously green release candidate fail.
        env:
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$FALLOW_AUDIT_BASE"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base^{commit}"; then
            requested_base="$base"
            if ! base=$(git rev-parse --verify HEAD^ 2>/dev/null); then
              echo "No prior commit is available for a changed-code audit; skipping." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            {
              echo "### Fallow audit base fallback"
              echo
              if [[ -n "$requested_base" && "$requested_base" != "0000000000000000000000000000000000000000" ]]; then
                echo "> Warning: requested base \`$requested_base\` is unavailable; auditing only since \`$base\`."
              else
                echo "> Warning: this event has no audit base; auditing only since \`$base\`."
              fi
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fallow's syntactic report supports Markdown, not GitHub workflow annotations. Surface
          # its deterministic changed-code report in the run summary instead.
          report="$RUNNER_TEMP/fallow-audit.md"
          # GitHub limits each job summary to 1 MiB. Reserve half for surrounding CI output,
          # while retaining enough detail for a useful changed-code report.
          max_report_bytes=524288
          set +e
          vp exec fallow audit --changed-since "$base" --format markdown --no-css-deep > "$report"
          status=$?
          set -e
          {
            echo "## Fallow audit"
            echo
            echo "Changed since: \`$base\`"
            echo
            if [[ -s "$report" ]]; then
              report_bytes=$(wc -c < "$report")
              head -c "$max_report_bytes" "$report"
              if (( report_bytes > max_report_bytes )); then
                echo
                echo "_Report truncated at $max_report_bytes bytes; see the step log for the full output._"
              fi
            elif [[ "$status" -eq 0 ]]; then
              echo "No changed-code findings."
            else
              echo "Audit failed before producing a Markdown report; see the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Build the node native addon
        run: vp run @estifanos-sh/convex-embedded#native

      - name: Test embedded
        run: |
          vp run @estifanos-sh/convex-embedded#test:unit
          vp run @estifanos-sh/convex-embedded#test:storage
          vp run @estifanos-sh/convex-embedded#test:server
          vp run @estifanos-sh/convex-embedded#test:surface
          vp run @estifanos-sh/convex-embedded#test:runtime

  wasm:
    name: WASM
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build the WASM runtime
        run: vp run @estifanos-sh/convex-embedded#wasm

      - name: Upload the WASM runtime
        uses: actions/upload-artifact@v7
        with:
          name: embedded-wasm
          path: packages/embedded/dist/wasm
          if-no-files-found: error
          retention-days: 1

  # Per-push this job is a compile smoke, not a release build: it produces the single Apple slice
  # the smoke app below links against. Release Native builds the full triple set.
  mobile-apple:
    name: iOS
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    continue-on-error: true
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.outputs.mobile == 'true'
      || github.event_name != 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The smoke app compiles with `-sdk iphoneos`, so the device triple is the only slice it
      # consumes. Dropping the simulator triple halves this job's Rust builds.
      - name: Prepare Rust and build the device XCFramework slice through the Expo hook
        env:
          CONVEX_EMBEDDED_MOBILE_SLICES: aarch64-apple-ios
          EAS_BUILD_PLATFORM: ios
        run: node demos/expo/scripts/native.ts eas

      - name: Compile Expo Apple autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts ios

      - name: Upload the device XCFramework slice
        uses: actions/upload-artifact@v7
        with:
          name: embedded-mobile-apple-smoke
          path: packages/embedded/native/apple
          if-no-files-found: error
          retention-days: 7

  # Per-push this job is a compile smoke, not a release build: it produces the single ABI the
  # smoke app below packages. Release Native builds the full ABI set.
  mobile-android:
    name: Android
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    continue-on-error: true
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.outputs.mobile == 'true'
      || github.event_name != 'pull_request')

    # `assembleDebug` packages whatever ABI directories exist and never runs the result, so the
    # shipping ABI alone proves the JNI surface links. Four ABIs would be four Rust builds. Both
    # the Rust build and the smoke app's Gradle invocation read this, so React Native's own
    # libraries and the Convex library are packaged for the same ABI by construction.
    env:
      CONVEX_EMBEDDED_MOBILE_SLICES: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Expo 54 and AGP require JDK 17.
      - name: Java setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # The smoke app is generated into a fresh temp directory on every run, so task output reuse
      # has to come from the build cache in the shared Gradle user home that setup-gradle caches.
      - name: Enable the Gradle build cache
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.caching=true" >> "$HOME/.gradle/gradle.properties"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare Rust and build the arm64-v8a library through the Expo hook
        env:
          EAS_BUILD_PLATFORM: android
        run: node demos/expo/scripts/native.ts eas

      - name: Compile Expo Android autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts android

      - name: Upload the arm64-v8a library
        uses: actions/upload-artifact@v7
        with:
          name: embedded-mobile-android-smoke
          path: packages/embedded/native/android
          if-no-files-found: error
          retention-days: 7
