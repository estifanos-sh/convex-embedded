name: Package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, publish a package preview, npm prerelease, or stable npm release
        required: true
        default: preview
        type: choice
        options: [verify, preview, prerelease, release]
      ref:
        description: Git ref or commit to validate and build
        required: false
        default: main
        type: string
      tag:
        description: Embedded release tag to create after validation; required for npm modes
        required: false
        type: string
concurrency:
  group: embedded-package-${{ inputs.tag || inputs.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      ref: ${{ steps.gate.outputs.ref }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Resolve package build
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PACKAGE_PREVIEW: ${{ contains(github.event.pull_request.labels.*.name, 'package preview') }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
              echo "::error::Package releases must dispatch the reviewed workflow from main."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            # `verify` deliberately takes the complete build, qualification, and assembly path;
            # the release-tag, preview, and npm-publish jobs below only admit publishing modes.
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_MODE" == "release" || "$INPUT_MODE" == "prerelease" ]]; then
              if [[ -z "$INPUT_TAG" ]]; then
                echo "::error::Prerelease and release modes require a v* tag."
                exit 1
              fi
              VERSION=${INPUT_TAG#v}
              if [[ "$VERSION" == "$INPUT_TAG" || -z "$VERSION" ]]; then
                echo "::error::Prerelease and release tags must use v<version>."
                exit 1
              fi
              if [[ "$INPUT_MODE" == "prerelease" && "$VERSION" != *-* ]]; then
                echo "::error::Prerelease mode requires an x.y.z-prerelease tag."
                exit 1
              fi
              if [[ "$INPUT_MODE" == "release" && "$VERSION" == *-* ]]; then
                echo "::error::Release mode requires a stable x.y.z tag."
                exit 1
              fi
              echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT" == "pull_request" && "$IS_DRAFT" == "false" && "$PACKAGE_PREVIEW" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "ref=$PR_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout requested package source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.gate.outputs.ref }}

      - name: Pin package build to one commit
        if: steps.gate.outputs.enabled == 'true'
        id: source
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$MODE" == "release" || "$MODE" == "prerelease" ]]; then
            # `actions/checkout` above used fetch-depth: 0 and already fetched origin/main.
            # Credentials are deliberately removed from this job, so a second fetch here would
            # turn an otherwise valid release gate into an interactive-authentication failure.
            if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
              echo "::error::Embedded npm releases must build a commit already reachable from main."
              exit 1
            fi
            if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
              if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
                echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, not validated source $SOURCE_SHA."
                exit 1
              fi
            fi
          fi

  qualification:
    name: Qualify
    # This job is deliberately credential-free. It runs the native build and qualification
    # workload; release authority stays in the GitHub token and npm OIDC jobs below.
    needs: [gate, javascript]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60

    steps:
      - name: Checkout exact source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-qualification
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - name: Download exact JavaScript and WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: embedded-dist
          path: packages/embedded/dist

      - name: Check source contracts and reachability
        run: |
          vp check
          vp run style
          vp run clippy

      - name: Verify Preview2 baseline and release stress
        env:
          CONVEX_EMBEDDED_PUBLISH_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          node packages/embedded/scripts/publish.ts fixture
          cargo test -p storage --features testkit --test fixture
          cargo test -p storage --features testkit --test migration
          cargo test -p mobile
          cargo test -p storage --release --features testkit --test stress candidate_cold_and_warm_stress_preserves_every_row -- --ignored --exact --nocapture
          cargo test -p storage --release --features testkit --test stress result_only_cursor_updates_batch_projection_dependencies -- --ignored --exact --nocapture
          vp test run packages/embedded/tests/unit/expo.ts

      - name: Install Chromium for production OPFS gates
        working-directory: packages/embedded
        run: vp exec playwright install --with-deps chromium

      - name: Verify production WASM OPFS conformance, worker death, stress, and memory ceilings
        working-directory: packages/embedded
        run: |
          vp test run --config vite/tests.ts --project browser tests/browser/fixture.ts
          vp test run --config vite/tests.ts --project browser tests/browser/stress.ts
          vp test run --config vite/tests.ts --project browser tests/browser/memory.ts

  javascript:
    name: JavaScript
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-wasm
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build and verify JavaScript
        env:
          CONVEX_EMBEDDED_PUBLISH_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          node packages/embedded/scripts/publish.ts prepare-build
          vp run '@estifanos-sh/convex-embedded#build:ts'
          vp run '@estifanos-sh/convex-embedded#test:surface'

      - name: Build WASM
        run: vp run '@estifanos-sh/convex-embedded#wasm'

      - name: Upload JavaScript and WASM
        uses: actions/upload-artifact@v7
        with:
          name: embedded-dist
          path: packages/embedded/dist
          if-no-files-found: error
          retention-days: 2

  node:
    name: Node ${{ matrix.target }}
    needs: [gate, javascript]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-8vcpu-ubuntu-2404
            target: linux-x64-gnu
          - runner: blacksmith-8vcpu-ubuntu-2404-arm
            target: linux-arm64-gnu
          - runner: blacksmith-6vcpu-macos-15
            target: darwin-arm64
          - runner: blacksmith-8vcpu-windows-2025
            target: win32-x64

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-node-${{ matrix.target }}
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Download JavaScript bundle for the Node smoke test
        uses: actions/download-artifact@v8
        with:
          name: embedded-dist
          path: packages/embedded/dist

      - name: Build and load Node addon
        if: matrix.target != 'win32-x64'
        run: |
          vp run '@estifanos-sh/convex-embedded#native'
          vp run '@estifanos-sh/convex-embedded#test:node'

      # Blacksmith's Windows image exposes Visual Studio but sets CC to clang-cl,
      # which is not installed on that image. Keep this setup adjacent to the
      # build so the Visual Studio environment and explicit MSVC compiler choice
      # apply only to the Windows native target.
      - name: Build and load Windows Node addon
        if: matrix.target == 'win32-x64'
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          set CC=cl.exe
          set CXX=cl.exe
          where cl.exe
          where link.exe
          vp run '@estifanos-sh/convex-embedded#native'
          vp run '@estifanos-sh/convex-embedded#test:node'

      - name: Verify packaged Linux Node durability
        if: matrix.target == 'linux-x64-gnu'
        run: |
          vp run '@estifanos-sh/convex-embedded#test:fixture:node'
          vp run '@estifanos-sh/convex-embedded#test:stress:node'
          vp run '@estifanos-sh/convex-embedded#test:kill:node'

      - name: Upload Node addon
        uses: actions/upload-artifact@v7
        with:
          name: embedded-node-${{ matrix.target }}
          path: packages/embedded/dist/native
          if-no-files-found: error
          retention-days: 2

  apple:
    name: Apple
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-apple
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Enable pnpm for the Expo compile fixture
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Build every Apple slice through the Expo hook
        env:
          EAS_BUILD_PLATFORM: ios
        run: node demos/expo/scripts/native.ts eas

      - name: Compile Expo Apple autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts ios

      - name: Upload Apple XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: embedded-apple
          path: packages/embedded/native/apple
          if-no-files-found: error
          retention-days: 2

  android:
    name: Android
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    # The complete four-ABI cargo-ndk build needs the 16-vCPU Linux allocation.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Install pinned Rust toolchain
        uses: ./.github/actions/rust

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: embedded-android
          key: ${{ hashFiles('rust-toolchain.toml') }}
          cache-on-failure: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Enable pnpm for the Expo compile fixture
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Build every Android ABI through the Expo hook
        env:
          EAS_BUILD_PLATFORM: android
        run: node demos/expo/scripts/native.ts eas

      - name: Compile Expo Android autolinking smoke app
        run: node packages/embedded/scripts/mobilecompile.ts android

      - name: Upload Android libraries
        uses: actions/upload-artifact@v7
        with:
          name: embedded-android
          path: packages/embedded/native/android
          if-no-files-found: error
          retention-days: 2

  assemble:
    name: Assemble
    needs: [gate, qualification, javascript, node, apple, android]
    if: needs.gate.outputs.enabled == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tarball_sha256: ${{ steps.tarball.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Enable pnpm for package assembly
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Resolve assembled source
        id: source
        env:
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Assembly checked out $SOURCE_SHA instead of qualified source $EXPECTED_SHA."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download JavaScript and WASM
        uses: actions/download-artifact@v8
        with:
          name: embedded-dist
          path: packages/embedded/dist

      - name: Download Node addons
        uses: actions/download-artifact@v8
        with:
          pattern: embedded-node-*
          path: packages/embedded/dist/native
          merge-multiple: true

      - name: Download Apple XCFramework
        uses: actions/download-artifact@v8
        with:
          name: embedded-apple
          path: packages/embedded/native/apple

      - name: Download Android libraries
        uses: actions/download-artifact@v8
        with:
          name: embedded-android
          path: packages/embedded/native/android

      - name: Verify native artifacts
        run: |
          node packages/embedded/scripts/mobile.ts verify
          vp run '@estifanos-sh/convex-embedded#test:node'

      - name: Prepare and pack the verified Embedded package
        env:
          CONVEX_EMBEDDED_PUBLISH_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          node packages/embedded/scripts/publish.ts prepare
          node packages/embedded/scripts/publish.ts pack artifacts "${{ needs.gate.outputs.mode }}"

      - name: Qualify exact packed artifact
        # The qualifier installs this archive in a clean temporary consumer. It needs ordinary
        # npm-registry reads to resolve runtime dependencies, but never receives publish credentials.
        run: |
          node packages/embedded/scripts/publish.ts qualify-tarball artifacts/convex-embedded.tgz "${{ needs.gate.outputs.mode }}"

      - name: Bind packed artifact digest
        id: tarball
        run: |
          SHA256=$(sha256sum artifacts/convex-embedded.tgz | awk '{print $1}')
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not calculate a SHA-256 for the assembled package."
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload assembled package
        uses: actions/upload-artifact@v7
        with:
          name: embedded-package
          path: artifacts/convex-embedded.tgz
          if-no-files-found: error
          retention-days: 2

  release-tag:
    name: Tag
    needs: [gate, qualification, assemble]
    if: needs.gate.outputs.mode == 'release' || needs.gate.outputs.mode == 'prerelease'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
      tarball_sha256: ${{ steps.tag.outputs.tarball_sha256 }}

    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}

      - name: Create or verify exact release tag
        id: tag
        env:
          ASSEMBLED_SHA: ${{ needs.assemble.outputs.sha }}
          ASSEMBLED_TARBALL_SHA256: ${{ needs.assemble.outputs.tarball_sha256 }}
          EXPECTED_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          if [[ "$SOURCE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $SOURCE_SHA instead of validated source $EXPECTED_SHA."
            exit 1
          fi
          if [[ "$ASSEMBLED_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Package was assembled from $ASSEMBLED_SHA instead of validated source $EXPECTED_SHA."
            exit 1
          fi
          if [[ ! "$ASSEMBLED_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Assembled package does not have a valid SHA-256."
            exit 1
          fi

          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$TAG_SHA" != "$EXPECTED_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, not validated source $EXPECTED_SHA."
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
              echo "::error::Tag $RELEASE_TAG must be annotated with its assembled package digest."
              exit 1
            fi
            if ! git cat-file -p "refs/tags/$RELEASE_TAG" | grep -Fq "Embedded package SHA-256: $ASSEMBLED_TARBALL_SHA256"; then
              echo "::error::Tag $RELEASE_TAG is not bound to the assembled package digest."
              exit 1
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "Embedded package SHA-256: $ASSEMBLED_TARBALL_SHA256"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$ASSEMBLED_TARBALL_SHA256" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview
    needs: [gate, assemble]
    if: needs.gate.outputs.mode == 'preview'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Download assembled package
        uses: actions/download-artifact@v8
        with:
          name: embedded-package
          path: artifacts

      - name: Publish package preview prerelease
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.assemble.outputs.sha }}
        run: |
          SHORT_SHA=${SHA:0:12}
          TAG="embedded-preview-$SHORT_SHA"
          TITLE="Embedded preview $SHORT_SHA"
          NOTES="Complete @estifanos-sh/convex-embedded preview assembled from $SHA. This is not an npm release."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/convex-embedded.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" artifacts/convex-embedded.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/convex-embedded.tgz"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update pull request preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_TAG: ${{ steps.preview.outputs.tag }}
          PREVIEW_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.assemble.outputs.sha }}
        with:
          script: |
            const marker = "<!-- convex-embedded-preview -->";
            const body = `${marker}
            ## Complete Embedded package preview

            This preview contains JavaScript, WASM, all four supported Node targets, both Apple slices, and all four Android ABIs. It is stored as an authenticated GitHub prerelease asset and is not published to npm.

            \`\`\`sh
            gh release download ${process.env.PREVIEW_TAG} --repo ${process.env.PREVIEW_REPOSITORY} --pattern convex-embedded.tgz --dir . --clobber
            pnpm add "@estifanos-sh/convex-embedded@file:./convex-embedded.tgz" convex
            \`\`\`

            Source: \`${process.env.SOURCE_SHA}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Document the official-name alias
        env:
          PREVIEW_TAG: ${{ steps.preview.outputs.tag }}
        run: |
          {
            echo "## Download and install this private-repository preview"
            echo
            echo "Authenticate \`gh\`, then run:"
            echo
            echo "\`gh release download $PREVIEW_TAG --repo $GITHUB_REPOSITORY --pattern convex-embedded.tgz --dir . --clobber\`"
            echo
            echo "\`pnpm add \"@estifanos-sh/convex-embedded@file:./convex-embedded.tgz\" convex\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [gate, qualification, assemble, release-tag]
    if: needs.gate.outputs.mode == 'release' || needs.gate.outputs.mode == 'prerelease'
    # npm trusted publishing and provenance attestations require a GitHub-hosted runner.
    # Native qualification remains on Blacksmith; this job only verifies and publishes the
    # already-qualified, digest-bound archive.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-tag.outputs.sha }}

      - name: Setup Node trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download assembled package
        uses: actions/download-artifact@v8
        with:
          name: embedded-package
          path: artifacts

      - name: Resolve release metadata
        id: release
        env:
          EXPECTED_VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED_TARBALL_SHA256: ${{ needs.release-tag.outputs.tarball_sha256 }}
          PUBLISH_MODE: ${{ needs.gate.outputs.mode }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          PACKAGE_NAME=$(
            tar -xOzf artifacts/convex-embedded.tgz package/package.json |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name"
          )
          VERSION=$(
            tar -xOzf artifacts/convex-embedded.tgz package/package.json |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          )
          TAG="v$VERSION"

          if [[ "$PACKAGE_NAME" != "@estifanos-sh/convex-embedded" ]]; then
            echo "::error::Refusing to publish unexpected package $PACKAGE_NAME."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $VERSION."
            exit 1
          fi
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Assembled version $VERSION does not match requested version $EXPECTED_VERSION."
            exit 1
          fi
          ACTUAL_TARBALL_SHA256=$(sha256sum artifacts/convex-embedded.tgz | awk '{print $1}')
          if [[ "$ACTUAL_TARBALL_SHA256" != "$EXPECTED_TARBALL_SHA256" ]]; then
            echo "::error::Downloaded package digest $ACTUAL_TARBALL_SHA256 does not match release tag digest $EXPECTED_TARBALL_SHA256."
            exit 1
          fi
          if ! git cat-file -p "refs/tags/$RELEASE_TAG" | grep -Fq "Embedded package SHA-256: $EXPECTED_TARBALL_SHA256"; then
            echo "::error::Release tag $RELEASE_TAG is not bound to the downloaded package digest."
            exit 1
          fi
          node packages/embedded/scripts/publish.ts verify-tarball artifacts/convex-embedded.tgz "$PUBLISH_MODE"

          if npm view "$PACKAGE_NAME@$VERSION" version --json >/dev/null 2>&1; then
            PUBLISHED=true
          else
            PUBLISHED=false
          fi
          echo "package=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The Embedded scope is the pre-official test channel. Its newest
          # qualified package must also be the default installation target,
          # including prereleases.
          echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"

      # Trusted publishing is bound by npm to this repository's workflow and emits provenance
      # for the public package. A copied workflow has no authority to obtain this credential.
      # Before the npm trusted publisher exists, NPM_BOOTSTRAP_TOKEN can publish the inaugural
      # package through this same qualified path. Remove that secret immediately after the first
      # successful publish: its absence selects OIDC, and it is never needed for later releases.
      - name: Publish qualified package
        if: steps.release.outputs.published != 'true'
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "${NPM_BOOTSTRAP_TOKEN:-}" ]]; then
            echo "::notice::Using the one-time npm bootstrap token fallback. Remove NPM_BOOTSTRAP_TOKEN after this inaugural publish."
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          else
            echo "Publishing with npm trusted publishing (OIDC)."
            unset NODE_AUTH_TOKEN
          fi
          npm publish ./artifacts/convex-embedded.tgz --ignore-scripts --access public --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Move prerelease channel
        if: needs.gate.outputs.mode == 'prerelease'
        run: npm dist-tag add "${{ steps.release.outputs.package }}@${{ steps.release.outputs.version }}" preview

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.gate.outputs.mode == 'prerelease' }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.package }} ${{ steps.release.outputs.version }}
          files: artifacts/convex-embedded.tgz
